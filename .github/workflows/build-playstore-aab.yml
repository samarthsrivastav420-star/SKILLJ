name: Build SKILLJ Google Play Store AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/**'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Build Web Project
        run: |
          npm ci || npm install
          npm run build

      - name: Generate Play Store TWA Bundle
        run: |
          python3 scripts/build_playstore_packages.py

      - name: Upload Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skillj-google-play-release-aab
          path: public/downloads/skillj-release.aab

      - name: Upload Full Android Project Zip
        uses: actions/upload-artifact@v4
        with:
          name: skillj-android-studio-project-zip
          path: public/downloads/skillj-play-store-twa.zip
